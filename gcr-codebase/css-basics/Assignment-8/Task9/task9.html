<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined CSS Effects</title>
    <link rel="stylesheet" href="task9.css">
</head>
<body>

    <header>
        <h1>Combined CSS Effects</h1>
    </header>

    <main>
        <section class="effects">

            <div class="effect">
                <button class="grow">Grow Button</button>
                <p>Hover: Scale + Color</p>
            </div>

            <div class="effect">
                <button class="move">Move Button</button>
                <p>Hover: Translate + Shadow</p>
            </div>

            <div class="effect">
                <button class="rotate">Rotate Button</button>
                <p>Hover: Rotate + Color</p>
            </div>

        </section>
    </main>

</body>
</html>
