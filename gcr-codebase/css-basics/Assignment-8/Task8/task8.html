<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing Comparison</title>
    <link rel="stylesheet" href="task8.css">
</head>
<body>

    <header>
        <h1>Box-Sizing Comparison</h1>
    </header>

    <main>
        <section class="comparison">

            <article class="box content-box">
                <h2>Default Box</h2>
                <p>
                    This uses content-box. Padding and border are added
                    outside the specified width.
                </p>
            </article>

            <article class="box border-box">
                <h2>Border Box</h2>
                <p>
                    This uses border-box. Padding and border are included
                    inside the specified width.
                </p>
            </article>

        </section>
    </main>

</body>
</html>
