<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="task10.css">
</head>
<body>

    <header>
        <h1>My Mini UI</h1>
    </header>

    <main>
        <section class="card">

            <div class="image-section">
                <img src="https://picsum.photos/250/180" alt="Nature Image">
            </div>

            <div class="content">

                <h2>Contact Us</h2>

                <form>

                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Enter your name">

                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email">

                    <label for="message">Message</label>
                    <textarea id="message" rows="4" placeholder="Write your message"></textarea>

                    <div class="buttons">
                        <button type="submit">Submit</button>
                        <button type="reset">Reset</button>
                    </div>

                </form>

            </div>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Mini UI. All Rights Reserved.</p>
    </footer>

</body>
</html>
