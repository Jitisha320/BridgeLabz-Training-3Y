<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltips</title>
    <link rel="stylesheet" href="task2.css">
</head>
<body>

    <header>
        <h1>CSS Tooltip Demonstration</h1>
    </header>

    <main>
        <section class="tooltip-container">

            <div class="tooltip-item">
                <span>Home</span>
                <span class="tooltip">Go to Home</span>
            </div>

            <div class="tooltip-item">
                <span>Profile</span>
                <span class="tooltip">View Profile</span>
            </div>

            <div class="tooltip-item">
                <span>Settings</span>
                <span class="tooltip">Open Settings</span>
            </div>

            <div class="tooltip-item">
                <span>Help</span>
                <span class="tooltip">Get Help</span>
            </div>

        </section>
    </main>

</body>
</html>
