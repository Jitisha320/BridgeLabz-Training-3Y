<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #dbeafe;
            color: #172554;
            font-family: Arial, sans-serif;
        }

        form {
            width: 90%;
            max-width: 500px;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        input:focus,
        textarea:focus {
            border-color: #2563eb;
            outline: none;
        }

        textarea {
            height: 120px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
        }
    </style>
</head>

<body>

<form>

    <h1>Contact Us</h1>

    <label>Name</label>
    <input type="text" placeholder="Enter your name">

    <label>Email</label>
    <input type="email" placeholder="Enter your email">

    <label>Subject</label>
    <input type="text" placeholder="Enter subject">

    <label>Message</label>
    <textarea placeholder="Write your message"></textarea>

    <button type="submit">Send Message</button>

</form>

</body>
</html>
