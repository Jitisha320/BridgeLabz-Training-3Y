<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 65px;
            background-color: #1e293b;
            color: white;
            padding: 20px;
            z-index: 10;
        }

        .layout {
            display: flex;
            padding-top: 65px;
            min-height: 100vh;
        }

        aside {
            width: 220px;
            min-height: calc(100vh - 65px);
            background-color: #334155;
            padding: 25px;
        }

        aside a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 5px;
        }

        main {
            flex: 1;
            padding: 30px;
        }

        .boxes {
            display: flex;
            gap: 25px;
        }

        .box {
            flex: 1;
            padding: 30px;
            background-color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .layout {
                flex-direction: column;
            }

            aside {
                width: 100%;
                min-height: auto;
            }

            .boxes {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>My Dashboard</h2>
</header>

<div class="layout">

    <aside>
        <a href="#">Dashboard</a>
        <a href="#">Profile</a>
        <a href="#">Projects</a>
        <a href="#">Settings</a>
    </aside>

    <main>
        <h1>Dashboard Overview</h1>

        <div class="boxes">

            <div class="box">
                <h2>Total Projects</h2>
                <p>12 Projects</p>
            </div>

            <div class="box">
                <h2>Completed Tasks</h2>
                <p>45 Tasks</p>
            </div>

        </div>
    </main>

</div>

</body>
</html>
