<!DOCTYPE html>
<html>
<head>
    <title>Our Team</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f1f5f9;
        }

        h1 {
            text-align: center;
            margin: 30px;
        }

        .team {
            display: flex;
            gap: 25px;
            justify-content: center;
            padding: 30px;
        }

        .card {
            width: 30%;
            padding: 25px;
            margin: 10px;
            border: 2px solid #cbd5e1;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            background-color: white;
            text-align: center;
        }

        .leader {
            background-color: #dbeafe;
            border: 3px solid #2563eb;
        }

        .card h2 {
            margin-bottom: 10px;
        }

        .card p {
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .team {
                flex-direction: column;
            }

            .card {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<h1>Meet Our Team</h1>

<div class="team">

    <div class="card leader">
        <h2>Jitisha Agarwal</h2>
        <h3>Team Lead</h3>
        <p>Leads the team and manages project development.</p>
    </div>

    <div class="card">
        <h2>Rahul Sharma</h2>
        <h3>Developer</h3>
        <p>Works on application development and programming.</p>
    </div>

    <div class="card">
        <h2>Priya Singh</h2>
        <h3>Designer</h3>
        <p>Creates attractive and user-friendly designs.</p>
    </div>

</div>

</body>
</html>
