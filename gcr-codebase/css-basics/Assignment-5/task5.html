<!DOCTYPE html>
<html>
<head>
    <title>Pricing Plans</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
        }

        h1 {
            text-align: center;
            margin: 40px;
        }

        .plans {
            display: flex;
            gap: 25px;
            justify-content: center;
            align-items: stretch;
            padding: 20px;
        }

        .plan {
            flex: 1;
            max-width: 350px;
            padding: 30px;
            background-color: white;
            border: 2px solid #cbd5e1;
            border-radius: 15px;
            text-align: center;
            transition: 0.3s;
        }

        .plan:hover {
            transform: scale(1.05);
            background-color: #e0f2fe;
        }

        .popular {
            border: 4px solid #2563eb;
        }

        .price {
            font-size: 2rem;
            font-weight: bold;
            margin: 20px;
        }

        li {
            margin: 12px;
        }

        .button {
            display: inline-block;
            padding: 12px 25px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        @media (max-width: 600px) {
            .plans {
                flex-direction: column;
                align-items: center;
            }

            .plan {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<h1>Choose Your Plan</h1>

<div class="plans">

    <div class="plan">
        <h2>Basic</h2>
        <div class="price">₹499</div>
        <ul>
            <li>5 Projects</li>
            <li>10 GB Storage</li>
            <li>Email Support</li>
        </ul>
        <a href="#" class="button">Choose Plan</a>
    </div>

    <div class="plan popular">
        <h2>Standard</h2>
        <div class="price">₹999</div>
        <ul>
            <li>15 Projects</li>
            <li>50 GB Storage</li>
            <li>Priority Support</li>
        </ul>
        <a href="#" class="button">Choose Plan</a>
    </div>

    <div class="plan">
        <h2>Premium</h2>
        <div class="price">₹1499</div>
        <ul>
            <li>Unlimited Projects</li>
            <li>100 GB Storage</li>
            <li>24/7 Support</li>
        </ul>
        <a href="#" class="button">Choose Plan</a>
    </div>

</div>

</body>
</html>
