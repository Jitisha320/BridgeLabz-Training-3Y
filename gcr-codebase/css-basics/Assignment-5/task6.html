<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f8fafc;
        }

        h1 {
            text-align: center;
            margin: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 30px;
        }

        .photo {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .photo img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s;
        }

        .caption {
            position: absolute;
            bottom: 0;
            width: 100%;
            background-color: rgba(0,0,0,0.7);
            color: white;
            text-align: center;
            padding: 12px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .photo:hover img {
            transform: scale(1.1);
        }

        .photo:hover .caption {
            opacity: 1;
        }

        @media (max-width: 800px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<h1>My Photo Gallery</h1>

<div class="gallery">

    <div class="photo">
        <img src="image1.jpg" alt="Nature">
        <div class="caption">Beautiful Nature</div>
    </div>

    <div class="photo">
        <img src="image2.jpg" alt="Mountain">
        <div class="caption">Mountain View</div>
    </div>

    <div class="photo">
        <img src="image3.jpg" alt="Beach">
        <div class="caption">Beautiful Beach</div>
    </div>

    <div class="photo">
        <img src="image4.jpg" alt="City">
        <div class="caption">City Lights</div>
    </div>

    <div class="photo">
        <img src="image5.jpg" alt="Forest">
        <div class="caption">Green Forest</div>
    </div>

    <div class="photo">
        <img src="image6.jpg" alt="Sunset">
        <div class="caption">Sunset</div>
    </div>

</div>

</body>
</html>
