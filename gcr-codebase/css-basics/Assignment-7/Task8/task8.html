<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Exploration</title>
    <link rel="stylesheet" href="task8.css">
</head>
<body>

    <header>
        <h1>CSS Box Model</h1>
    </header>

    <main>
        <section class="model">

            <div class="margin-layer">
                <span>Margin</span>

                <div class="border-layer">
                    <span>Border</span>

                    <div class="padding-layer">
                        <span>Padding</span>

                        <div class="content-layer">
                            Content
                        </div>

                    </div>
                </div>
            </div>

            <div class="description">
                <p><strong>Content:</strong> Actual information inside the box.</p>
                <p><strong>Padding:</strong> Space between content and border.</p>
                <p><strong>Border:</strong> Line surrounding padding and content.</p>
                <p><strong>Margin:</strong> Space outside the border.</p>
            </div>

            <div class="comparison">
                <div class="default-box">
                    Default Box
                </div>

                <div class="border-box">
                    Border-box
                </div>
            </div>

        </section>
    </main>

</body>
</html>
