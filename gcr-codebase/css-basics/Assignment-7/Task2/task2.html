<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Practice</title>
    <link rel="stylesheet" href="task2.css">
</head>
<body>

    <header>
        <h1>Height and Width Practice</h1>
    </header>

    <main>
        <section class="container">

            <div class="box box1">
                <h2>Fixed Size</h2>
                <p>Width: 200px<br>Height: 180px</p>
            </div>

            <div class="box box2">
                <h2>Percentage Size</h2>
                <p>Width: 30% and Height: 25vh</p>
            </div>

            <div class="box box3">
                <h2>Em Size</h2>
                <p>This box uses em units and overflow.</p>
                <p>This extra content demonstrates the overflow property.</p>
            </div>

        </section>
    </main>

</body>
</html>
