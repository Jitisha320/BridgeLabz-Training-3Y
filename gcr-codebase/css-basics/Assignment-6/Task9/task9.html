<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <div class="card">

            <div class="card-front">
                <img src="https://picsum.photos/400/250" alt="Nature">
                <h2>Nature</h2>
            </div>

            <div class="card-back">
                <h2>Beautiful Nature</h2>
                <p>
                    Nature provides us with beautiful landscapes, fresh air
                    and peaceful surroundings.
                </p>
            </div>

        </div>

    </main>

</body>
</html>
