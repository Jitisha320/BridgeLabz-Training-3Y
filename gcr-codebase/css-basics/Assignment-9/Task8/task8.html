<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>

    <header>
        <h1>Filter Comparison</h1>
    </header>

    <main>
        <section class="comparison">

            <figure>
                <img src="https://picsum.photos/id/1015/500/350" alt="Original Image">
                <figcaption>Original Image</figcaption>
            </figure>

            <figure>
                <img class="filtered" src="https://picsum.photos/id/1015/500/350" alt="Filtered Image">
                <figcaption>Filtered Image</figcaption>
            </figure>

        </section>
    </main>

</body>
</html>
