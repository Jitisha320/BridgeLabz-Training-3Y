<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards Animation</title>
    <link rel="stylesheet" href="filter-cards-animation.css">
</head>
<body>

    <header>
        <h1>Profile Cards</h1>
    </header>

    <main>
        <section class="cards">

            <article class="card">
                <img class="gray" src="https://picsum.photos/id/1005/400/300" alt="Profile">
                <h2>Alex</h2>
                <p>Web Developer</p>
            </article>

            <article class="card">
                <img class="sepia" src="https://picsum.photos/id/1012/400/300" alt="Profile">
                <h2>Sarah</h2>
                <p>UI Designer</p>
            </article>

            <article class="card">
                <img class="gray" src="https://picsum.photos/id/1011/400/300" alt="Profile">
                <h2>John</h2>
                <p>Cloud Engineer</p>
            </article>

        </section>
    </main>

</body>
</html>
