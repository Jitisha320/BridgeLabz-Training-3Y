<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Responsive Typography</title>
    <link rel="stylesheet" href="responsive-typography.css">
</head>
<body>

    <header>
        <h1>Responsive Typography</h1>
    </header>

    <main>
        <section class="content">
            <h1>Learn Responsive Web Design</h1>

                content on different screen sizes.

    <footer>
