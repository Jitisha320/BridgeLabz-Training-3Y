<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>

    <header>
        <h1>Image Filter Gallery</h1>
    </header>

    <main>
        <section class="gallery">

            <figure>
                <img class="blur" src="https://picsum.photos/id/1015/500/350" alt="Mountain">
                <figcaption>Blur Filter</figcaption>
            </figure>

            <figure>
                <img class="grayscale" src="https://picsum.photos/id/1016/500/350" alt="Nature">
                <figcaption>Grayscale Filter</figcaption>
            </figure>

            <figure>
                <img class="sepia" src="https://picsum.photos/id/1018/500/350" alt="Landscape">
                <figcaption>Sepia Filter</figcaption>
            </figure>

            <figure>
                <img class="brightness" src="https://picsum.photos/id/1025/500/350" alt="Dog">
                <figcaption>Brightness Filter</figcaption>
            </figure>

            <figure>
                <img class="contrast" src="https://picsum.photos/id/1035/500/350" alt="River">
                <figcaption>Contrast Filter</figcaption>
            </figure>

            <figure>
                <img class="hue" src="https://picsum.photos/id/1043/500/350" alt="Forest">
                <figcaption>Hue Rotate Filter</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Image Filter Gallery</p>
    </footer>

</body>
</html>
