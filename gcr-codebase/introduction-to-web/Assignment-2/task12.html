<!DOCTYPE html>
<html>
<head>
    <title>Creative Paragraph</title>
</head>
<body>

    <p>
        <strong>Learning HTML</strong> is the first step toward
        becoming a web developer.

        It can be <em>interesting and creative</em> when we practice.

        <small>Every small step counts.</small>
    </p>

</body>
</html>
